document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStudentHome }}\">\n<div style=\"max-width:820px\">\n<div class=\"text-secondary small mb-1\">{{ todayLabel }}<\u002Fdiv>\n<h1 class=\"display-6 fw-bold mb-1\">Hi, Marc!<\u002Fh1>\n<p class=\"text-secondary mb-4\">{{ studentName }} · {{ sTeamName }} · {{ sRotationName }}<\u002Fp>\n<div class=\"card mb-4\" style=\"background:#E4ECF7;border-color:#C9D8EE\">\n<div class=\"card-body p-4\">\n<div class=\"small fw-semibold text-uppercase text-primary mb-2\" style=\"letter-spacing:.08em\">Continue your rotation<\u002Fdiv>\n<h2 class=\"h4 card-title card-title--accent mb-3\">{{ sCurrentTitle }}<\u002Fh2>\n<p class=\"small mb-4\" style=\"color:#3A4A53\">{{ sCurrentMeta }}<\u002Fp>\n<div class=\"progress\" role=\"progressbar\" style=\"height:8px;background:#FFFFFF\"><div class=\"progress-bar\" style=\"width:{{ sProgressPct }}\"><\u002Fdiv><\u002Fdiv>\n<div class=\"d-flex justify-content-between align-items-center gap-3 flex-wrap mt-3\">\n<span class=\"small\" style=\"color:#3A4A53\">{{ sProgressText }}<\u002Fspan>\n<sc-if value=\"{{ sCanContinue }}\"><button type=\"button\" sc-camel-on-click=\"{{ continueRotation }}\" class=\"btn btn-cta\">{{ continueLabel }}<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card mb-4\">\n<div class=\"card-header bg-white d-flex justify-content-between align-items-center gap-2 py-3\"><h2 class=\"h6 fw-bold mb-0\">Your teammates<\u002Fh2><span class=\"small text-secondary\">{{ sTeamName }}<\u002Fspan><\u002Fdiv>\n<div class=\"list-group list-group-flush\">\n<sc-for list=\"{{ sMates }}\" as=\"tm\" hint-placeholder-count=\"3\">\n<div class=\"list-group-item d-flex align-items-center gap-3 py-3\">\n<span class=\"rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-bold small flex-shrink-0\" style=\"width:36px;height:36px\">{{ tm.initials }}<\u002Fspan>\n<div class=\"flex-grow-1\" style=\"min-width:0\"><div class=\"fw-semibold\">{{ tm.name }}<\u002Fdiv><a href=\"{{ tm.mailto }}\" class=\"small text-decoration-none\">{{ tm.email }}<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ sNoMates }}\"><div class=\"card-body text-center text-secondary small py-4\">You don’t have any teammates yet.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"card\">\n<div class=\"card-header bg-white py-3\"><h2 class=\"h6 fw-bold mb-0\">Rotation sequence<\u002Fh2><\u002Fdiv>\n<div class=\"list-group list-group-flush\">\n<sc-for list=\"{{ sSeq }}\" as=\"q\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ q.onClick }}\" class=\"list-group-item list-group-item-action d-flex align-items-center gap-3 py-3\">\n<span class=\"rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-bold small flex-shrink-0\" style=\"width:28px;height:28px\">{{ q.num }}<\u002Fspan>\n<div class=\"flex-grow-1\" style=\"min-width:0\"><div class=\"fw-semibold\">{{ q.title }}<\u002Fdiv><div class=\"small text-secondary\">{{ q.type }}<\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{ q.done }}\"><span class=\"badge bg-success-subtle text-success-emphasis border border-success-subtle\">✓ Completed<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ q.current }}\"><span class=\"badge bg-primary-subtle text-primary-emphasis border border-primary-subtle\">→ Up next<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ q.todo }}\"><span class=\"badge bg-secondary-subtle text-secondary-emphasis border\">○ Not started<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ q.locked }}\"><span class=\"badge bg-secondary-subtle text-secondary-emphasis border d-inline-flex align-items-center gap-1\"><span class=\"d-inline-flex flex-column align-items-center\"><span style=\"width:5px;height:4px;border:1.5px solid currentColor;border-bottom:none;border-radius:3px 3px 0 0\"><\u002Fspan><span style=\"width:8px;height:6px;border-radius:1px;background:currentColor\"><\u002Fspan><\u002Fspan>Locked<\u002Fspan><\u002Fsc-if>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isStudentRotation }}\">\n<div class=\"d-flex justify-content-between align-items-end gap-3 flex-wrap mb-4\">\n<div><div class=\"small text-secondary mb-1\">{{ sRotationName }}<\u002Fdiv><h1 class=\"h2 fw-bold mb-0\">Rotation<\u002Fh1><\u002Fdiv>\n<span class=\"badge text-bg-primary fs-6 fw-semibold\">{{ stepLabel }}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ sEmpty }}\"><div class=\"alert alert-light border text-center py-5 mb-0\">Your rotation has no prompts yet.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ sAllLocked }}\"><div class=\"alert alert-light border text-center py-5 mb-0\">Your rotation is locked. Your faculty will unlock it when it’s time to begin.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ sHasPrompts }}\">\n<div class=\"row g-4 align-items-start\">\n<div class=\"col-lg-4 col-xl-3 sticky-lg-top\" style=\"top:24px\">\n<div class=\"card\" style=\"max-height:calc(100vh - 48px)\">\n<div class=\"card-header bg-white py-3\"><div class=\"fw-semibold small\">Prompts<\u002Fdiv><div class=\"small text-secondary\">{{ sProgressText }}<\u002Fdiv><\u002Fdiv>\n<div class=\"list-group list-group-flush overflow-auto\">\n<sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n<sc-if value=\"{{ st.active }}\"><button type=\"button\" sc-camel-on-click=\"{{ st.onClick }}\" class=\"list-group-item list-group-item-action bg-primary-subtle d-flex gap-3 align-items-start py-3\">\n<span class=\"rounded-circle border border-2 border-primary bg-white text-primary d-inline-flex align-items-center justify-content-center fw-bold flex-shrink-0\" style=\"width:26px;height:26px;font-size:12px\">{{ st.num }}<\u002Fspan>\n<span style=\"min-width:0\"><span class=\"d-block small fw-bold text-primary-emphasis\">{{ st.title }}<\u002Fspan><span class=\"d-block small text-secondary\">{{ st.typeLabel }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ st.done }}\"><button type=\"button\" sc-camel-on-click=\"{{ st.onClick }}\" class=\"list-group-item list-group-item-action d-flex gap-3 align-items-start py-3\">\n<span class=\"rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center fw-bold flex-shrink-0\" style=\"width:26px;height:26px;font-size:12px\">✓<\u002Fspan>\n<span style=\"min-width:0\"><span class=\"d-block small fw-medium\">{{ st.title }}<\u002Fspan><span class=\"d-block small text-secondary\">{{ st.typeLabel }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ st.todo }}\"><button type=\"button\" sc-camel-on-click=\"{{ st.onClick }}\" class=\"list-group-item list-group-item-action d-flex gap-3 align-items-start py-3\">\n<span class=\"rounded-circle border bg-white text-secondary d-inline-flex align-items-center justify-content-center fw-semibold flex-shrink-0\" style=\"width:26px;height:26px;font-size:12px\">{{ st.num }}<\u002Fspan>\n<span style=\"min-width:0\"><span class=\"d-block small fw-medium text-secondary\">{{ st.title }}<\u002Fspan><span class=\"d-block small text-secondary\">{{ st.typeLabel }}<\u002Fspan><\u002Fspan>\n<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ st.locked }}\"><div class=\"list-group-item disabled d-flex gap-3 align-items-start py-3\" aria-disabled=\"true\">\n<span class=\"rounded-circle bg-body-secondary d-inline-flex flex-column align-items-center justify-content-center flex-shrink-0\" style=\"width:26px;height:26px\"><span style=\"width:6px;height:5px;border:1.5px solid #7A8A93;border-bottom:none;border-radius:3px 3px 0 0\"><\u002Fspan><span style=\"width:9px;height:7px;border-radius:1.5px;background:#7A8A93\"><\u002Fspan><\u002Fspan>\n<span style=\"min-width:0\"><span class=\"d-block small fw-medium\">{{ st.title }}<\u002Fspan><span class=\"d-block small\">{{ st.typeLabel }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"col-lg-8 col-xl-9\">\n<div class=\"card\">\n<div class=\"card-body p-4\">\n<div class=\"small fw-semibold text-uppercase text-primary mb-2\" style=\"letter-spacing:.08em\">Prompt {{ sOrder }}<\u002Fdiv>\n<h2 class=\"h3 fw-bold mb-3\">{{ sTitle }}<\u002Fh2>\n<p class=\"fs-6 mb-0\" style=\"line-height:1.65;text-wrap:pretty\">{{ sText }}<\u002Fp>\n<\u002Fdiv>\n<div class=\"card-body p-4 border-top\">\n<div class=\"small fw-semibold text-uppercase text-secondary mb-3\" style=\"letter-spacing:.08em;font-size:12px\">{{ mTypeLabel }}<\u002Fdiv>\n\n<sc-if value=\"{{ mFile }}\">\n<div class=\"card\"><div class=\"card-body d-flex align-items-center gap-3 flex-wrap\">\n<span class=\"rounded bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-bold small flex-shrink-0\" style=\"width:48px;height:56px\">{{ mExt }}<\u002Fspan>\n<div class=\"flex-grow-1\" style=\"min-width:200px\"><div class=\"fw-semibold\">{{ mTitle }}<\u002Fdiv><div class=\"small text-secondary\">{{ mFileName }}<\u002Fdiv><div class=\"small mt-2\">{{ mDesc }}<\u002Fdiv><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ onDownload }}\" class=\"btn btn-outline-primary\">Download<\u002Fbutton>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mUrl }}\">\n<div class=\"card\"><div class=\"card-body d-flex align-items-center gap-3 flex-wrap\">\n<div class=\"flex-grow-1\" style=\"min-width:200px\"><div class=\"fw-semibold\">{{ mTitle }}<\u002Fdiv><div class=\"small text-secondary text-break\">{{ mHref }}<\u002Fdiv><div class=\"small mt-2\">{{ mDesc }}<\u002Fdiv><\u002Fdiv>\n<a href=\"{{ mHref }}\" target=\"_blank\" rel=\"noopener\" class=\"btn btn-outline-primary\">Open link ↗<\u002Fa>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mBoard }}\">\n<div class=\"alert alert-primary mb-3\">\n<div class=\"fw-semibold mb-1\">{{ mTitle }}<\u002Fdiv>\n<p class=\"mb-1\">{{ mStarter }}<\u002Fp>\n<\u002Fdiv>\n<div class=\"d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3\">\n<span class=\"fw-semibold\">{{ dCount }}<\u002Fspan>\n<div class=\"d-flex align-items-center gap-2\"><span class=\"small text-secondary\">Sort by<\u002Fspan>\n<div class=\"btn-group btn-group-sm\" role=\"group\" aria-label=\"Sort comments\">\n<sc-for list=\"{{ dSorts }}\" as=\"so\">\n<sc-if value=\"{{ so.active }}\"><button type=\"button\" sc-camel-on-click=\"{{ so.onClick }}\" class=\"btn btn-primary\" title=\"{{ so.hint }}\">{{ so.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ so.inactive }}\"><button type=\"button\" sc-camel-on-click=\"{{ so.onClick }}\" class=\"btn btn-outline-secondary\" title=\"{{ so.hint }}\">{{ so.label }}<\u002Fbutton><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ dOpen }}\">\n<div class=\"mb-3\">\n<textarea rows=\"2\" value=\"{{ dDraft }}\" sc-camel-on-change=\"{{ dSetDraft }}\" placeholder=\"Add a comment…\" class=\"form-control mb-2\" aria-label=\"Add a comment\"><\u002Ftextarea>\n<div class=\"d-flex justify-content-end\"><button type=\"button\" sc-camel-on-click=\"{{ dPost }}\" class=\"btn btn-primary btn-sm\">Comment<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ dClosed }}\"><div class=\"alert alert-secondary py-2 small mb-3\"><span class=\"fw-bold me-1\">ⓘ<\u002Fspan>This board is not open for new comments or votes.<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ dFocused }}\"><div class=\"alert alert-light border d-flex justify-content-between align-items-center flex-wrap gap-2 py-2 small mb-2\"><span>{{ dFocusLabel }}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ dUnfocus }}\" class=\"btn btn-link btn-sm p-0\">← Back to full discussion<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<div>\n<sc-for list=\"{{ dRows }}\" as=\"c\" hint-placeholder-count=\"4\">\n<div id=\"{{ c.anchor }}\" class=\"d-flex rounded {{ c.sepCls }} {{ c.hlCls }}\">\n<sc-for list=\"{{ c.rails }}\" as=\"rl\"><button type=\"button\" sc-camel-on-click=\"{{ rl.onClick }}\" title=\"{{ rl.title }}\" aria-label=\"{{ rl.title }}\" class=\"btn p-0 border-0 rounded-0 flex-shrink-0\" style=\"width:24px;background:linear-gradient(#DCE3E7,#DCE3E7) center/2px 100% no-repeat\" style-hover=\"background:linear-gradient(#1D4F91,#1D4F91) center/2px 100% no-repeat\"><\u002Fbutton><\u002Fsc-for>\n<div class=\"flex-grow-1 py-2\" style=\"min-width:0\">\n<sc-if value=\"{{ c.isComment }}\">\n<div class=\"d-flex align-items-center gap-2\" style=\"min-width:0\">\n<button type=\"button\" sc-camel-on-click=\"{{ c.onToggle }}\" aria-label=\"{{ c.toggleLabel }}\" title=\"{{ c.toggleLabel }}\" class=\"btn btn-light border p-0 d-inline-flex align-items-center justify-content-center flex-shrink-0\" style=\"width:28px;height:28px;font-size:15px;line-height:1\">{{ c.toggleGlyph }}<\u002Fbutton>\n<span class=\"rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-bold flex-shrink-0\" style=\"width:28px;height:28px;font-size:12px\">{{ c.initials }}<\u002Fspan>\n<span class=\"small fw-semibold text-nowrap\">{{ c.author }}<\u002Fspan>\n<sc-if value=\"{{ c.isFaculty }}\"><span class=\"badge text-bg-primary\">Faculty<\u002Fspan><\u002Fsc-if>\n<span class=\"small text-secondary text-nowrap\">{{ c.time }}<\u002Fspan>\n<sc-if value=\"{{ c.isNew }}\"><span class=\"badge\" style=\"background:#0077C8\">New<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ c.onMarkRead }}\" class=\"btn btn-link btn-sm p-0 text-secondary text-nowrap\">Mark as read<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ c.collapsed }}\"><span class=\"small text-secondary text-truncate\">· {{ c.summary }}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ c.expanded }}\">\n<div style=\"padding-left:36px\">\n<p class=\"small mb-1 mt-1\" style=\"line-height:1.55;text-wrap:pretty\">{{ c.text }}<\u002Fp>\n<div class=\"d-flex align-items-center gap-1\">\n<sc-if value=\"{{ c.canAct }}\">\n<sc-if value=\"{{ c.liked }}\"><button type=\"button\" sc-camel-on-click=\"{{ c.onLike }}\" aria-pressed=\"true\" aria-label=\"Unlike\" class=\"btn btn-link btn-sm text-primary text-decoration-none fw-semibold d-inline-flex align-items-center gap-1 px-1\" style=\"min-height:32px\">♥ Liked<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ c.notLiked }}\"><button type=\"button\" sc-camel-on-click=\"{{ c.onLike }}\" aria-pressed=\"false\" aria-label=\"Like\" class=\"btn btn-link btn-sm text-secondary text-decoration-none fw-semibold d-inline-flex align-items-center gap-1 px-1\" style=\"min-height:32px\">♡ Like<\u002Fbutton><\u002Fsc-if>\n<\u002Fsc-if>\n<sc-if value=\"{{ c.hasLikes }}\"><span class=\"small text-secondary\">{{ c.likeLabel }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ c.canAct }}\">\n<button type=\"button\" sc-camel-on-click=\"{{ c.onReply }}\" class=\"btn btn-link btn-sm text-secondary text-decoration-none fw-semibold ms-1\" style=\"min-height:32px\">Reply<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<sc-if value=\"{{ c.replying }}\">\n<div class=\"mt-1 mb-2\">\n<textarea rows=\"2\" value=\"{{ c.replyText }}\" sc-camel-on-change=\"{{ c.setReplyText }}\" placeholder=\"{{ c.replyingTo }}\" aria-label=\"{{ c.replyingTo }}\" class=\"form-control form-control-sm mb-2\"><\u002Ftextarea>\n<div class=\"d-flex justify-content-end gap-2\">\n<button type=\"button\" sc-camel-on-click=\"{{ c.cancelReply }}\" class=\"btn btn-outline-secondary btn-sm\">Cancel<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ c.submitReply }}\" class=\"btn btn-primary btn-sm\">Reply<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n<sc-if value=\"{{ c.isContinue }}\"><button type=\"button\" sc-camel-on-click=\"{{ c.onContinue }}\" class=\"btn btn-link btn-sm px-0 fw-semibold text-decoration-none\" style=\"min-height:32px\">Continue this thread → <span class=\"text-secondary fw-normal\">{{ c.moreLabel }}<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ dEmpty }}\"><p class=\"text-secondary small text-center py-4 mb-0\">No comments yet. Start the discussion.<\u002Fp><\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mQuiz }}\">\n<div class=\"d-flex justify-content-between align-items-baseline gap-2 flex-wrap mb-3\"><span class=\"h5 fw-semibold mb-0\">{{ mTitle }}<\u002Fspan><span class=\"small text-secondary\">{{ quizMeta }}<\u002Fspan><\u002Fdiv>\n<div class=\"d-flex flex-column gap-4\">\n<sc-for list=\"{{ qItems }}\" as=\"q\" hint-placeholder-count=\"3\">\n<div>\n<div class=\"fw-semibold mb-2\">{{ q.num }}. {{ q.text }}<\u002Fdiv>\n<div class=\"row g-2\">\n<sc-for list=\"{{ q.opts }}\" as=\"o\">\n<div class=\"col-md-6\">\n<sc-if value=\"{{ o.neutral }}\"><button type=\"button\" sc-camel-on-click=\"{{ o.onPick }}\" class=\"btn btn-outline-secondary w-100 text-start d-flex align-items-center gap-2\"><span class=\"badge bg-secondary-subtle text-secondary-emphasis\">{{ o.letter }}<\u002Fspan>{{ o.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ o.selected }}\"><button type=\"button\" sc-camel-on-click=\"{{ o.onPick }}\" class=\"btn btn-primary w-100 text-start d-flex align-items-center gap-2\"><span class=\"badge bg-white text-primary\">{{ o.letter }}<\u002Fspan>{{ o.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ o.correct }}\"><div class=\"border border-success rounded bg-success-subtle text-success-emphasis fw-semibold px-3 py-2 d-flex align-items-center gap-2\"><span class=\"badge text-bg-success\">✓<\u002Fspan>{{ o.label }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ o.wrong }}\"><div class=\"border border-danger rounded bg-danger-subtle text-danger-emphasis fw-semibold px-3 py-2 d-flex align-items-center gap-2\"><span class=\"badge text-bg-danger\">✕<\u002Fspan>{{ o.label }}<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ o.locked }}\"><div class=\"border rounded text-secondary px-3 py-2 d-flex align-items-center gap-2\"><span class=\"badge bg-secondary-subtle text-secondary-emphasis\">{{ o.letter }}<\u002Fspan>{{ o.label }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div class=\"mt-4\">\n<sc-if value=\"{{ quizOpen }}\">\n<div class=\"d-flex align-items-center gap-3 flex-wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ submitQuiz }}\" class=\"btn btn-primary\">Submit quiz<\u002Fbutton>\n<sc-if value=\"{{ hasQuizError }}\"><span class=\"small text-danger fw-medium\">{{ quizError }}<\u002Fspan><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ quizPassed }}\"><div class=\"alert alert-success d-flex justify-content-between align-items-center gap-2 flex-wrap mb-0\"><span class=\"fw-semibold\">✓ {{ quizResultText }}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ retakeQuiz }}\" class=\"btn btn-sm btn-outline-success\">Retake<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ quizFailed }}\"><div class=\"alert alert-danger d-flex justify-content-between align-items-center gap-2 flex-wrap mb-0\"><span class=\"fw-semibold\">✕ {{ quizResultText }}<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ retakeQuiz }}\" class=\"btn btn-sm btn-outline-danger\">Retake<\u002Fbutton><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ mNone }}\"><p class=\"text-secondary small mb-0\">No media is attached to this prompt.<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"card-footer bg-body-tertiary d-flex align-items-center gap-2 py-3 px-4\">\n<sc-if value=\"{{ hasPrev }}\"><button type=\"button\" sc-camel-on-click=\"{{ onPrev }}\" class=\"btn btn-outline-secondary\">← Previous<\u002Fbutton><\u002Fsc-if>\n<span class=\"ms-auto small text-secondary\">{{ stepLabel }}<\u002Fspan>\n<sc-if value=\"{{ nextOpen }}\"><button type=\"button\" sc-camel-on-click=\"{{ onNext }}\" class=\"btn btn-cta\">{{ nextLabel }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ nextLocked }}\"><button type=\"button\" sc-camel-on-click=\"{{ onNextLocked }}\" class=\"btn btn-secondary\" style=\"opacity:.65;cursor:not-allowed\">Next prompt locked<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isAbout }}\">\n<div style=\"max-width:720px\">\n<h1 class=\"h2 fw-bold mb-3\">About eHospital<\u002Fh1>\n<p class=\"lead mb-4\">eHospital is an education platform for clinical training. Faculty organize interns into teams, build rotations from a sequence of prompts and supporting media, and review the feedback interns share along the way.<\u002Fp>\n<div class=\"d-flex flex-column gap-3\">\n<div class=\"card\"><div class=\"card-body p-4\">\n<h2 class=\"h5 card-title card-title--accent text-primary mb-3\">Mission<\u002Fh2>\n<p class=\"card-text mb-0\">Give every intern a structured, well-supported rotation, and give faculty a clear view of how their interns are progressing.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div class=\"card-body p-4\">\n<h2 class=\"h5 card-title card-title--accent text-primary mb-3\">How it works<\u002Fh2>\n<p class=\"card-text mb-0\">Faculty build a sequence of prompts, each with a file, link, discussion board or quiz attached. Students work through the prompts in order, and faculty review the resulting feedback by thread, intern or keyword.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<div class=\"card\"><div class=\"card-body p-4\">\n<h2 class=\"h5 card-title card-title--accent text-primary mb-3\">Contact<\u002Fh2>\n<p class=\"card-text mb-0\">Questions or access requests: <a href=\"mailto:bs2886@cumc.columbia.edu\">bs2886@cumc.columbia.edu<\u002Fa><\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCommentsTab }}\">\n<div class=\"card\">\n<div class=\"card-header bg-white d-flex justify-content-between align-items-center gap-2 flex-wrap py-3\">\n<div class=\"d-flex align-items-center gap-2\"><h2 class=\"h6 fw-bold mb-0\">Comments<\u002Fh2><span class=\"badge bg-secondary-subtle text-secondary-emphasis\">{{ fcCount }}<\u002Fspan><\u002Fdiv>\n<div class=\"d-flex align-items-center gap-3 flex-wrap\">\n<div class=\"btn-group btn-group-sm\" role=\"group\" aria-label=\"Filter comments\">\n<sc-for list=\"{{ fcFilters }}\" as=\"ff\">\n<sc-if value=\"{{ ff.active }}\"><button type=\"button\" sc-camel-on-click=\"{{ ff.onClick }}\" aria-pressed=\"true\" class=\"btn btn-primary\">{{ ff.label }}<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ ff.inactive }}\"><button type=\"button\" sc-camel-on-click=\"{{ ff.onClick }}\" aria-pressed=\"false\" class=\"btn btn-outline-secondary\">{{ ff.label }}<\u002Fbutton><\u002Fsc-if>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ hasUnread }}\"><button type=\"button\" sc-camel-on-click=\"{{ markAllRead }}\" class=\"btn btn-outline-primary btn-sm\">Mark all as read<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"list-group list-group-flush\">\n<sc-for list=\"{{ fcRows }}\" as=\"ua\" hint-placeholder-count=\"3\">\n<div class=\"list-group-item d-flex gap-3 align-items-start flex-wrap py-3\">\n<span class=\"rounded-circle bg-primary-subtle text-primary-emphasis d-inline-flex align-items-center justify-content-center fw-bold flex-shrink-0\" style=\"width:36px;height:36px;font-size:12px\">{{ ua.initials }}<\u002Fspan>\n<div class=\"flex-grow-1\" style=\"min-width:0;flex-basis:260px\">\n<div class=\"d-flex align-items-center gap-2 flex-wrap\"><sc-if value=\"{{ ua.isNew }}\"><span class=\"badge\" style=\"background:#0077C8\">New<\u002Fspan><\u002Fsc-if><span class=\"small fw-semibold\">{{ ua.author }}<\u002Fspan><span class=\"small text-secondary\">{{ ua.context }}<\u002Fspan><span class=\"small text-secondary\">· {{ ua.time }}<\u002Fspan><\u002Fdiv>\n<p class=\"small mb-1 mt-1\" style=\"text-wrap:pretty\">{{ ua.snippet }}<\u002Fp>\n<div class=\"small text-secondary\">{{ ua.board }}<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"d-flex align-items-center gap-2 flex-shrink-0\">\n<button type=\"button\" sc-camel-on-click=\"{{ ua.onView }}\" class=\"btn btn-outline-primary btn-sm\">View in discussion<\u002Fbutton>\n<sc-if value=\"{{ ua.isNew }}\"><button type=\"button\" sc-camel-on-click=\"{{ ua.onMarkRead }}\" class=\"btn btn-link btn-sm text-secondary\">Mark as read<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ fcEmptyUnread }}\"><div class=\"card-body text-center py-4\"><div class=\"fw-semibold mb-1\">You’re all caught up<\u002Fdiv><div class=\"small text-secondary\">New student comments and replies will show up here.<\u002Fdiv><\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ fcEmptyAll }}\"><div class=\"card-body text-center text-secondary py-4\">No comments yet.<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isListPage }}\">\n<div class=\"d-flex flex-column gap-4\">\n<sc-for list=\"{{ lists }}\" as=\"l\" hint-placeholder-count=\"1\">\n<div class=\"card\">\n<div class=\"card-header bg-white d-flex justify-content-between align-items-center gap-2 py-3\">\n<div class=\"d-flex align-items-center gap-2\"><h2 class=\"h6 fw-bold mb-0\">{{ l.title }}<\u002Fh2><span class=\"badge bg-secondary-subtle text-secondary-emphasis\">{{ l.count }}<\u002Fspan><\u002Fdiv>\n<sc-if value=\"{{ l.hasAdd }}\"><button type=\"button\" sc-camel-on-click=\"{{ l.onAdd }}\" class=\"btn btn-cta\">+ {{ l.addLabel }}<\u002Fbutton><\u002Fsc-if>\n<\u002Fdiv>\n<div class=\"table-responsive\">\n<sc-raw-table class=\"table table-hover align-middle mb-0\">\n<sc-raw-thead class=\"table-light\"><sc-raw-tr>\n<sc-for list=\"{{ l.cols }}\" as=\"col\"><sc-raw-th scope=\"col\" class=\"small text-uppercase text-secondary fw-semibold text-nowrap px-3\" style=\"font-size:12px;letter-spacing:.06em\">{{ col }}<\u002Fsc-raw-th><\u002Fsc-for>\n<\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{ l.rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n<sc-raw-tr sc-camel-on-click=\"{{ row.onClick }}\" style=\"cursor:pointer\">\n<sc-for list=\"{{ row.cells }}\" as=\"cell\"><sc-raw-td class=\"px-3 py-3\">\n<sc-if value=\"{{ cell.strong }}\"><span class=\"fw-semibold\">{{ cell.text }}<\u002Fspan><\u002Fsc-if>\n<sc-if value=\"{{ cell.plain }}\"><span>{{ cell.text }}<\u002Fspan><\u002Fsc-if>\n<\u002Fsc-raw-td><\u002Fsc-for>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<sc-if value=\"{{ l.isEmpty }}\"><div class=\"card-body text-center text-secondary py-5\">{{ l.emptyText }}<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isForm }}\">\n<div class=\"card\" style=\"max-width:760px\">\n<div class=\"card-body p-4\">\n<sc-for list=\"{{ formFields }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div class=\"mb-4\">\n<label class=\"form-label fw-semibold small\">{{ f.label }}<sc-if value=\"{{ f.required }}\"><span class=\"text-danger\"> *<\u002Fspan><\u002Fsc-if><\u002Flabel>\n<sc-if value=\"{{ f.isInput }}\"><input type=\"{{ f.inputType }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" class=\"form-control\"><\u002Fsc-if>\n<sc-if value=\"{{ f.isTextarea }}\"><textarea rows=\"4\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" class=\"form-control\"><\u002Ftextarea><\u002Fsc-if>\n<sc-if value=\"{{ f.isSelect }}\"><sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" class=\"form-select\"><option value=\"\">Select…<\u002Foption><sc-for list=\"{{ f.options }}\" as=\"o\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n<sc-if value=\"{{ f.isMediaPick }}\"><div class=\"row g-2\">\n<div class=\"col-sm-6\"><sc-raw-select value=\"{{ f.typeValue }}\" sc-camel-on-change=\"{{ f.onType }}\" class=\"form-select\"><option value=\"\">No media<\u002Foption><sc-for list=\"{{ f.typeOptions }}\" as=\"o\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv>\n<sc-if value=\"{{ f.hasType }}\"><div class=\"col-sm-6\"><sc-raw-select value=\"{{ f.itemValue }}\" sc-camel-on-change=\"{{ f.onItem }}\" class=\"form-select\"><option value=\"\">Select item…<\u002Foption><sc-for list=\"{{ f.itemOptions }}\" as=\"o\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv><\u002Fsc-if>\n<sc-if value=\"{{ f.isQuestions }}\"><div class=\"d-flex flex-column gap-3\">\n<sc-for list=\"{{ f.qs }}\" as=\"q\">\n<div class=\"card bg-body-tertiary\"><div class=\"card-body d-flex flex-column gap-2\">\n<div class=\"d-flex justify-content-between align-items-center\"><span class=\"small fw-bold text-uppercase text-secondary\" style=\"font-size:12px;letter-spacing:.06em\">Question {{ q.num }}<\u002Fspan><sc-if value=\"{{ q.canRemove }}\"><button type=\"button\" sc-camel-on-click=\"{{ q.onRemove }}\" class=\"btn btn-link btn-sm text-danger p-0\">Remove<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n<input value=\"{{ q.text }}\" sc-camel-on-change=\"{{ q.onText }}\" placeholder=\"Question text\" class=\"form-control\">\n<sc-for list=\"{{ q.opts }}\" as=\"o\"><div class=\"input-group input-group-sm\">\n<sc-if value=\"{{ o.isCorrect }}\"><button type=\"button\" sc-camel-on-click=\"{{ o.onMark }}\" title=\"Correct answer\" class=\"btn btn-success\" style=\"width:38px\">✓<\u002Fbutton><\u002Fsc-if>\n<sc-if value=\"{{ o.notCorrect }}\"><button type=\"button\" sc-camel-on-click=\"{{ o.onMark }}\" title=\"Mark as correct answer\" class=\"btn btn-outline-secondary bg-white\" style=\"width:38px\">{{ o.letter }}<\u002Fbutton><\u002Fsc-if>\n<input value=\"{{ o.value }}\" sc-camel-on-change=\"{{ o.onChange }}\" placeholder=\"Option {{ o.letter }}\" class=\"form-control\">\n<\u002Fdiv><\u002Fsc-for>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for> pikes',description:'Six-step framework for delivering difficult news.'},\n    {id:'u3',title:'Admission order set guide',url:'https://intranet.ehospital.edu/ehr/admission-orders',description:'How to use the standard admission order sets in the EHR.'}\n  ],\n  boards: [\n    {id:'b1',title:'Overnight escalation: what would you do?',starter:\"Describe a time a patient's condition changed during a shift. What did you notice first, and when did you decide to escalate?\",posts:[\n      {id:'c1',parent:null,author:\"James Okafor\",role:'Intern',ts:'2026-10-09T19:12:00',up:9,down:0,text:\"A post-op patient became tachycardic and confused around 2 AM. I checked vitals and a glucose, then paged my senior when the heart rate stayed above 120.\"},\n      {id:'c2',parent:'c1',author:\"Dr. Trudi Cloyd\",role:'Faculty',ts:'2026-10-10T07:30:00',up:7,down:0,text:\"Good call checking a glucose first. What made you decide to page rather than call rapid response?\"},\n      {id:'c3',parent:'c2',author:\"James Okafor\",role:'Intern',ts:'2026-10-10T08:05:00',up:4,down:0,text:\"His blood pressure was still normal and he was answering questions, so I thought a page was enough.\"},\n      {id:'c4',parent:'c3',author:\"Hannah Lee\",role:'Intern',ts:'2026-10-10T09:20:00',up:3,down:0,text:\"We were taught that new confusion on its own meets rapid response criteria here. Is that right?\"},\n      {id:'c5',parent:'c4',author:\"Dr. Trudi Cloyd\",role:'Faculty',ts:'2026-10-10T10:02:00',up:5,down:0,text:\"Yes. An acute change in mental status is one of the criteria. You can always call, and the team can stand down if things look stable.\"},\n      {id:'c6',parent:'c5',author:\"James Okafor\",role:'Intern',ts:'2026-10-10T10:40:00',up:2,down:0,text:\"That's helpful. I didn't know calling and then cancelling was acceptable.\"},\n      {id:'c7',parent:'c1',author:\"Daniel Kim\",role:'Intern',ts:'2026-10-10T12:15:00',up:1,down:0,text:\"Did the tachycardia turn out to be a bleed?\"},\n      {id:'c8',parent:'c7',author:\"James Okafor\",role:'Intern',ts:'2026-10-10T13:00:00',up:2,down:0,text:\"Pulmonary embolism, actually. CT angiogram confirmed it that morning.\"},\n      {id:'c9',parent:null,author:\"Priya Shah\",role:'Intern',ts:'2026-10-10T11:30:00',up:6,down:1,text:\"In the ED, a patient on the board for chest pain dropped their pressure while waiting. The nurse flagged it first. I called the attending right away and we moved them to a resus bay.\"},\n      {id:'c10',parent:'c9',author:\"Aisha Rahman\",role:'Intern',ts:'2026-10-11T09:10:00',up:2,down:0,text:\"How long had they been waiting before the drop?\"},\n      {id:'c11',parent:'c10',author:\"Priya Shah\",role:'Intern',ts:'2026-10-11T10:25:00',up:1,down:0,text:\"About forty minutes. Their triage vitals had been normal.\"},\n      {id:'c12',parent:null,author:\"Hannah Lee\",role:'Intern',ts:'2026-10-11T20:45:00',up:1,down:0,text:\"Mine was a sepsis case: fever and rigors right at shift change. I wasn't sure whether the day or night team owned the escalation.\"}]},\n    {id:'b2',title:'Progress note peer review',starter:'Post a de-identified progress note and give feedback on one colleague’s note.',posts:[]},\n    {id:'b3',title:'Week 1 reflections',starter:'What surprised you most about your first week on the wards?',posts:[\n      {id:'w1',parent:null,author:\"Aisha Rahman\",role:'Intern',ts:'2026-09-03T18:20:00',up:4,down:0,text:\"How much of the day goes to documentation rather than seeing patients.\"},\n      {id:'w2',parent:'w1',author:\"Dr. Trudi Cloyd\",role:'Faculty',ts:'2026-09-04T07:45:00',up:3,down:0,text:\"That's common in the first weeks. It gets faster once the templates feel familiar.\"}]}\n  ],\n  readPosts: SEED_READ,\n  quizzes: [\n    {id:'q1',title:'Cardiac arrest algorithms',passing:80,questions:[\n      {text:'Which drug is given first in pulseless VT/VF after the second shock?',options:['Atropine 1 mg IV','Epinephrine 1 mg IV','Adenosine 6 mg IV','Calcium chloride 1 g IV'],correct:1}
